[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "deep-learning-laboratory"
version = "0.1.0"
description = "A readable laboratory of deep learning primitives and paper-replication experiments."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "torch>=2.1",
    "numpy>=1.24",
]

[project.optional-dependencies]
development = ["pytest>=8"]

[tool.setuptools]
packages = ["laboratory"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
